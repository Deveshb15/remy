name: Remy
options:
  bundleIdPrefix: dev.devesh
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: J84CXH5N6L
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RemyKit:
    path: Packages/RemyKit
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
targets:
  Remy:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [AppIcon.icon]
      # Icon Composer bundle (Liquid Glass icon); added as one file so actool compiles it.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      # The onboarding renders the real widget, so its views compile into the app too.
      - Widget/WidgetViews.swift
      - Widget/Provider.swift
      - Widget/ToggleTodoIntent.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Remy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        RemyAppGroup: $(TeamIdentifierPrefix)dev.devesh.remy
        CFBundleURLTypes:
          - CFBundleURLName: dev.devesh.remy
            CFBundleURLSchemes: [remy]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)dev.devesh.remy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devesh.remy
        PRODUCT_NAME: Remy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: RemyKit
      - target: RemyWidget
      - target: RemyCLI
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  RemyWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, App/UI/Theme.swift]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Remy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RemyAppGroup: $(TeamIdentifierPrefix)dev.devesh.remy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)dev.devesh.remy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devesh.remy.widget
    dependencies:
      - package: RemyKit
  # Target name differs from the app's beyond case: on case-insensitive APFS, "remy" and "Remy" share build dirs.
  RemyCLI:
    type: tool
    platform: macOS
    sources: [CLI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devesh.remy.cli
        PRODUCT_NAME: remy
        PRODUCT_MODULE_NAME: RemyCLI
    dependencies:
      - package: RemyKit
      - package: MCP
        product: MCP
  # Dev-only: renders the popover and widget views to PNGs (`Snapshots <dir>`). Not shipped.
  Snapshots:
    type: tool
    platform: macOS
    sources:
      - Snapshots
      - App/AppController.swift
      - App/NotificationReconciler.swift
      - App/SocketServer.swift
      - App/StoreWatcher.swift
      - App/UI
      - App/Onboarding
      - Widget/WidgetViews.swift
      - Widget/Provider.swift
      - Widget/ToggleTodoIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devesh.remy.snapshots
        PRODUCT_MODULE_NAME: Snapshots
    dependencies:
      - package: RemyKit
schemes:
  Remy:
    build:
      targets:
        Remy: all
    run:
      config: Debug
